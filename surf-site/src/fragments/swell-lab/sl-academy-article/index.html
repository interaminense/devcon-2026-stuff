	<script data-articles type="application/json">{"board-guide": {"body": ["Your first board should float you, not fight you. Look for a soft-top between 8 and 9 feet with plenty of volume: around twice your body weight in liters is a good start.", "Length gives you glide and stability, width keeps you balanced while you pop up, and a rounded nose forgives late take-offs. Leave the short, pointy boards for later."], "href": "/lessons", "image": "/documents/d/guest/lesson-beginner-jpg?download=true", "lead": "Volume, length, and shape decide how fast you stand up. A simple guide to choosing the foam board that makes your first waves easy.", "tag": "Gear", "title": "How to pick your first board"}, "tide-101": {"body": ["Tides move the water over sand bars and reefs, and that changes how waves break. At Praia do Rosa, mid tide on a rising swell gives the most consistent peaks.", "Low tide can expose rocks at the point and make waves dump hard. High tide often slows the beach break down. Check a tide chart and plan for the two hours around mid tide."], "href": "/spots", "image": "/documents/d/guest/spot-sunset-beach-jpg?download=true", "lead": "Low, mid, or high? Learn the three tide windows that turn a flat beach into perfect peaks, with real examples from Praia do Rosa.", "tag": "Ocean", "title": "Read the tide like a local"}, "pop-up-drill": {"body": ["Lie flat on the floor, hands under your chest. In one move, push up and bring your front foot between your hands, landing low with knees bent and eyes forward.", "Repeat it ten times, rest, and do three rounds. Five minutes a day for a week and the move becomes automatic, so in the water you think about the wave, not your feet."], "href": "/lessons", "image": "/documents/d/guest/lesson-intermediate-jpg?download=true", "lead": "Practice the move that gets you on your feet. Do it at home before your first lesson and stand up on day one.", "tag": "Technique", "title": "The 5-minute pop-up drill"}, "wetsuit-guide": {"body": ["Water in southern Brazil goes from 24 °C in summer to 16 °C in winter. Above 22 °C a shorty or a top is enough; between 17 and 22 °C wear a 3/2 mm full suit.", "Below 17 °C switch to a 4/3 mm with booties. Cold costs energy: a warmer suit keeps you paddling longer and catching more waves."], "href": "/book", "image": "/documents/d/guest/surf-shack-jpg?download=true", "lead": "Cold feet end sessions early. Which thickness to wear in every month of the year in southern Brazil.", "tag": "Gear", "title": "Wetsuit thickness by season"}, "surf-info": {"body": ["Surfing is riding waves on a board.", "There are many things to know about it."], "href": "/lessons", "image": "/documents/d/guest/spot-reef-jpg?download=true", "lead": "Some information about surfing.", "tag": "General", "title": "Information"}, "lineup-etiquette": {"body": ["The surfer closest to the peak has priority. Never drop in on someone already riding, and paddle around the break, not through it.", "Hold your board, call your wave, and wait your turn. If you get in someone's way, a quick apology keeps the lineup friendly."], "href": "/spots", "image": "/documents/d/guest/lesson-advanced-jpg?download=true", "lead": "Drop-ins are the fastest way to make enemies. The five lineup rules every surfer should know before paddling out.", "tag": "Culture", "title": "Surf etiquette: who has priority"}, "wave-choice": {"body": ["Good waves peak and peel to one side. Watch the set for a few minutes from the beach and notice where the peak forms and which way it breaks.", "Avoid the waves that stand up all at once along their length: they close out. Pick the shoulder of a peeling wave and paddle early."], "href": "/spots", "image": "/documents/d/guest/hero-barrel-jpg?download=true", "lead": "Not every wave is yours. How to spot the ones that will carry you, and the ones that will close out on your head.", "tag": "Ocean", "title": "Choose the right wave"}, "paddle-power": {"body": ["Lie centered on the board with your chest slightly raised and your feet together. If the nose dips or sticks up, move until it sits just above the water.", "Reach forward, pull deep under the board, and let your hands exit at your hips. Long, steady strokes beat fast splashing every time."], "href": "/lessons", "image": "/documents/d/guest/trip-portugal-jpg?download=true", "lead": "Most beginners run out of energy in ten minutes. Fix your arm stroke and body position to stay out twice as long.", "tag": "Technique", "title": "Paddle longer, not harder"}, "forecast-basics": {"body": ["Start with swell size and period: a 1 m swell at 10 seconds or more brings more power than a 2 m swell at 6 seconds.", "Then check the wind. Offshore or no wind keeps the waves clean; strong onshore wind makes them messy. Good size, long period, and light offshore is the morning to wake up early."], "href": "/spots", "image": "/documents/d/guest/trip-costa-rica-jpg?download=true", "lead": "Swell size, period, and wind direction. The three numbers that tell you if tomorrow is worth the early alarm.", "tag": "Ocean", "title": "Read a surf forecast in 3 steps"}, "trip-packing": {"body": ["Pack a padded board bag, two leashes, base and top wax for the water temperature, fins with a key, and reef booties for rocky breaks.", "Add reef-safe sunscreen, a rash guard, a ding repair kit, and the item everyone forgets: a spare fin screw."], "href": "/trips", "image": "/documents/d/guest/trip-bali-jpg?download=true", "lead": "Board bag, leash, wax, reef booties, and the one item everyone forgets. Pack once, surf the whole week.", "tag": "Trips", "title": "The surf trip packing list"}, "post-surf-stretch": {"body": ["After a session, spend ten minutes on the sand: open your chest and shoulders against your board, then stretch your hip flexors in a low lunge.", "Finish with a child's pose for your lower back. Your body recovers faster and you paddle out stronger the next day."], "href": "/lessons", "image": "/documents/d/guest/spot-reef-jpg?download=true", "lead": "Shoulders, lower back, and hips take the hit. A short routine on the sand that keeps you surfing tomorrow.", "tag": "Body", "title": "A 10-minute stretch after surfing"}, "sun-care": {"body": ["Use a reef-safe sunscreen with zinc oxide, apply it twenty minutes before paddling out, and reapply every two hours or after a long session.", "Wear a rash guard and a cap for the longest sessions. Your skin and the reefs you surf both stay healthy."], "href": "/book", "image": "/documents/d/guest/spot-sunset-beach-jpg?download=true", "lead": "Reef-safe sunscreen, zinc, and when to reapply. Protect your skin without hurting the reefs you surf.", "tag": "Body", "title": "Sun care for long sessions"}}</script>
