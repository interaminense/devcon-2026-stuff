<div id="ldp-visitors" style="font-family: inherit; max-width: 760px; border: 1px solid #e7e7ed; border-radius: 8px; padding: 20px; background: #fff;">
	<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
		<div>
			<div style="font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #6b6c7e;">LDP · via DXP GraphQL proxy</div>
			<div style="font-size: 20px; font-weight: 600; color: #272833;">Site visitors</div>
		</div>
		<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px;">
			<select data-role="range" style="padding: 4px 8px;">
				<option value="7">Last 7 days</option>
				<option selected value="30">Last 30 days</option>
				<option value="90">Last 90 days</option>
				<option value="365">Last 365 days</option>
				<option value="custom">Custom range</option>
			</select>
			<span data-role="custom" style="display: none; gap: 6px; align-items: center;">
				<input data-role="start" type="date" />
				<span>→</span>
				<input data-role="end" type="date" />
			</span>
		</div>
	</div>

	<div style="display: flex; gap: 32px; margin: 16px 0;">
		<div>
			<div style="font-size: 12px; color: #6b6c7e;">Total visitors</div>
			<div data-role="total" style="font-size: 28px; font-weight: 600; color: #272833;">-</div>
		</div>
		<div>
			<div style="font-size: 12px; color: #6b6c7e;">Peak day</div>
			<div data-role="peak" style="font-size: 28px; font-weight: 600; color: #272833;">-</div>
		</div>
	</div>

	<svg data-role="chart" preserveAspectRatio="none" style="width: 100%; height: 200px; display: block;" viewBox="0 0 700 200"></svg>

	<div data-role="axis" style="display: flex; justify-content: space-between; font-size: 12px; color: #6b6c7e; margin-top: 4px;"></div>
	<div data-role="status" style="font-size: 13px; color: #6b6c7e; margin-top: 12px;"></div>
</div>

<script>
(function () {
	var root = document.getElementById('ldp-visitors');

	if (!root || root.dataset.ready) {
		return;
	}

	root.dataset.ready = 'true';

	var QUERY =
		'query SitesMetricQuery($channelId: String!, $interval: String!, $rangeEnd: String, $rangeKey: Int, $rangeStart: String) {' +
		' site(channelId: $channelId, interval: $interval, rangeEnd: $rangeEnd, rangeKey: $rangeKey, rangeStart: $rangeStart) {' +
		' visitorsMetric { histogram { metrics { key value } } } } }';

	function $(role) {
		return root.querySelector('[data-role="' + role + '"]');
	}

	function request(url, options) {
		return fetch(
			url,
			Object.assign({credentials: 'include'}, options, {
				headers: Object.assign(
					{
						'Content-Type': 'application/json',
						'x-csrf-token': Liferay.authToken,
					},
					options && options.headers
				),
			})
		).then(function (response) {
			if (!response.ok) {
				throw new Error(url + ' returned ' + response.status);
			}

			return response.json();
		});
	}

	var channelPromise = request(
		'/o/analytics-settings-rest/v1.0/channels?pageSize=200'
	).then(function (page) {
		var groupId = Number(Liferay.ThemeDisplay.getScopeGroupId());

		var channel = (page.items || []).find(function (item) {
			return (item.dataSources || []).some(function (dataSource) {
				return (dataSource.siteIds || []).map(Number).includes(groupId);
			});
		});

		if (!channel) {
			throw new Error('No LDP channel is connected to this site');
		}

		return channel.channelId;
	});

	function variables(channelId) {
		var range = $('range').value;

		if (range !== 'custom') {
			return {channelId: channelId, interval: 'D', rangeKey: Number(range)};
		}

		return {
			channelId: channelId,
			interval: 'D',
			rangeEnd: $('end').value,
			rangeStart: $('start').value,
		};
	}

	function render(metrics) {
		var svg = $('chart');
		var width = 700;
		var height = 200;
		var max = Math.max.apply(null, metrics.map(function (metric) { return metric.value; }).concat([1]));
		var step = metrics.length > 1 ? width / (metrics.length - 1) : 0;

		var points = metrics.map(function (metric, index) {
			return [index * step, height - 10 - (metric.value / max) * (height - 20)];
		});

		var line = points.map(function (point) { return point.join(','); }).join(' ');

		svg.innerHTML =
			'<polygon fill="rgba(11,95,255,.12)" points="0,' + height + ' ' + line + ' ' + width + ',' + height + '"></polygon>' +
			'<polyline fill="none" points="' + line + '" stroke="#0b5fff" stroke-width="2" vector-effect="non-scaling-stroke"></polyline>';

		var total = metrics.reduce(function (sum, metric) { return sum + metric.value; }, 0);
		var peak = metrics.reduce(function (best, metric) { return metric.value > best.value ? metric : best; }, {value: 0});

		$('total').textContent = total.toLocaleString();
		$('peak').textContent = peak.key ? peak.value + ' on ' + peak.key.slice(0, 10) : '-';

		var first = metrics[0] ? metrics[0].key.slice(0, 10) : '';
		var last = metrics.length ? metrics[metrics.length - 1].key.slice(0, 10) : '';

		$('axis').innerHTML = '<span>' + first + '</span><span>' + last + '</span>';
	}

	function load() {
		var custom = $('range').value === 'custom';

		$('custom').style.display = custom ? 'inline-flex' : 'none';

		if (custom && !($('start').value && $('end').value)) {
			$('status').textContent = 'Pick a start and an end date.';

			return;
		}

		$('status').textContent = 'Loading...';

		var startedAt = performance.now();

		channelPromise
			.then(function (channelId) {
				var body = {query: QUERY, variables: variables(channelId)};

				return request('/o/analytics-rest/v1.0/graphql', {
					body: JSON.stringify(body),
					method: 'POST',
				}).then(function (json) {
					if (json.errors) {
						throw new Error(json.errors[0].message);
					}

					render(json.data.site.visitorsMetric.histogram.metrics);

					$('status').textContent =
						'POST /o/analytics-rest/v1.0/graphql · ' +
						JSON.stringify(body.variables) + ' · ' +
						Math.round(performance.now() - startedAt) + ' ms';
				});
			})
			.catch(function (error) {
				$('status').textContent = 'Error: ' + error.message;
			});
	}

	['range', 'start', 'end'].forEach(function (role) {
		$(role).addEventListener('change', load);
	});

	load();
})();
</script>
